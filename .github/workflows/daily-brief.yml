name: Daily brief

on:
  workflow_dispatch:
  schedule:
    # Target ~6:45 a.m. America/Chicago on weekdays. GitHub cron is UTC-only
    # and often delayed (sometimes by hours), so several morning slots run and
    # a once-per-Central-day gate keeps only the first refresh.
    # 11:47 UTC ≈ 6:47 a.m. CDT / 5:47 a.m. CST
    # 12:47 UTC ≈ 7:47 a.m. CDT / 6:47 a.m. CST
    # Later slots catch delayed earlier triggers.
    - cron: "47 11 * * 1-5"
    - cron: "47 12 * * 1-5"
    - cron: "47 13 * * 1-5"
    - cron: "47 14 * * 1-5"
    - cron: "47 15 * * 1-5"

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run once per Central weekday (or on manual dispatch)
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch; refreshing."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(TZ=America/Chicago date +%F)
          now_central=$(TZ=America/Chicago date '+%Y-%m-%d %H:%M %Z')
          if [ ! -f brief-data.json ]; then
            echo "No brief-data.json yet; refreshing at ${now_central}."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          brief_day=$(
            python3 - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          payload = json.load(open("brief-data.json", encoding="utf-8"))
          generated = payload.get("generated_at")
          if not generated:
              print("")
              raise SystemExit(0)
          moment = datetime.fromisoformat(generated)
          if moment.tzinfo is None:
              from datetime import timezone
              moment = moment.replace(tzinfo=timezone.utc)
          print(moment.astimezone(ZoneInfo("America/Chicago")).date().isoformat())
          PY
          )
          if [ "$brief_day" = "$today" ]; then
            echo "Brief already generated for ${today} Central (last: ${brief_day}); skipping at ${now_central}."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Last brief day ${brief_day:-none}; today is ${today} Central. Refreshing at ${now_central}."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh brief data
        if: steps.gate.outputs.run == 'true'
        run: python3 scripts/refresh-brief.py

      - name: Commit and push brief-data.json
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brief-data.json
          if git diff --cached --quiet; then
            echo "brief-data.json unchanged"
            exit 0
          fi
          git commit -m "Refresh brief data"
          git push

      - name: Notify that the brief is ready
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/refresh-brief.py --notice-body notice.md
          title="Daily Investment Brief"
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq '.[] | select(.title == "Daily Investment Brief") | .number' | head -n 1)
          if [ -z "$number" ]; then
            gh issue create --title "$title" --body-file notice.md
          else
            gh issue comment "$number" --body-file notice.md
          fi
