name: Daily brief

on:
  workflow_dispatch:
  schedule:
    # 6:45 a.m. America/Chicago, Monday–Friday. GitHub cron is UTC and does
    # not follow daylight time, so both Central offsets are scheduled:
    # 11:45 UTC during daylight time and 12:45 UTC during standard time.
    # The gate below lets only the 6:45 a.m. Central run continue.
    - cron: "45 11 * * 1-5"
    - cron: "45 12 * * 1-5"

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Run only at 6:45 a.m. Central
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$(TZ=America/Chicago date +%H)
          minute=$(TZ=America/Chicago date +%M)
          # Accept 6:45 through 7:29 Central so a slightly late cron still
          # runs. The other offset lands at 5:45 or 7:45 and is skipped.
          if [ "$hour" = "06" ] || { [ "$hour" = "07" ] && [ "$minute" -lt 30 ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Central time is ${hour}:${minute}; skipping this offset."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh brief data
        run: python3 scripts/refresh-brief.py

      - name: Commit and push brief-data.json
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brief-data.json
          if git diff --cached --quiet; then
            echo "brief-data.json unchanged"
            exit 0
          fi
          git commit -m "Refresh brief data"
          git push

      - name: Notify that the brief is ready
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/refresh-brief.py --notice-body notice.md
          title="Daily Investment Brief"
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq '.[] | select(.title == "Daily Investment Brief") | .number' | head -n 1)
          if [ -z "$number" ]; then
            gh issue create --title "$title" --body-file notice.md
          else
            gh issue comment "$number" --body-file notice.md
          fi
