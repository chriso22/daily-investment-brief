name: Daily brief

on:
  workflow_dispatch:
  schedule:
    # 21:30 UTC, Monday–Friday. That is 5:30 p.m. Eastern during daylight
    # time and 4:30 p.m. Eastern during standard time, after the U.S. cash close.
    - cron: "30 21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh brief data
        run: python3 scripts/refresh-brief.py

      - name: Commit and push brief-data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brief-data.json
          if git diff --cached --quiet; then
            echo "brief-data.json unchanged"
            exit 0
          fi
          git commit -m "Refresh brief data"
          git push
